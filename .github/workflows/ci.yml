name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Optional dashboard/HITL API deps (see docs/INSTALL.md) — installed so
      # the API modules import and their tests run in CI.
      - run: pip install fastapi PyJWT
      - run: pip install pytest
      - run: pytest
